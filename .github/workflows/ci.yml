name: CI

on:
  push:
    branches: [main, backend, frontend, 'infra/**', 'fix/**']
    paths: &ci-paths
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.env.example'
      - 'README.md'
  pull_request:
    branches: [main, backend, frontend, 'infra/**', 'fix/**']
    paths: *ci-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    name: Backend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  test:
    name: Backend test suite (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bhoomitrace
          POSTGRES_PASSWORD: bhoomitrace
          POSTGRES_DB: bhoomitrace
          POSTGRES_TEST_DB: bhoomitrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bhoomitrace -d bhoomitrace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      TEST_DATABASE_URL: postgres://bhoomitrace:bhoomitrace@127.0.0.1:5432/bhoomitrace_test
      DATABASE_URL: postgres://bhoomitrace:bhoomitrace@127.0.0.1:5432/bhoomitrace
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      EXTRACTION_PROVIDER: mock
      AUTH_RATE_LIMIT_MAX: '10000'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          node -e '
            const net = require("net");
            const deadline = Date.now() + 60000;
            (function tryConnect() {
              const s = net.createConnection(5432, "127.0.0.1", () => { s.end(); process.exit(0); });
              s.on("error", () => {
                if (Date.now() > deadline) { console.error("postgres not ready"); process.exit(1); }
                setTimeout(tryConnect, 1000);
              });
            })();
          '

      - name: Create test database
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=bhoomitrace \
            -e POSTGRES_TEST_DB=bhoomitrace_test \
            -v "${{ github.workspace }}/docker/postgres/init:/scripts:ro" \
            postgres:17-alpine \
            psql -h 127.0.0.1 -U bhoomitrace -d postgres -v ON_ERROR_STOP=1 -f /scripts/01-create-test-database.sql

      - name: Seed synthetic test data
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://bhoomitrace:bhoomitrace@127.0.0.1:5432/bhoomitrace_test
        run: npm run db:seed

      - name: Run test suite
        run: npm test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Unit and contract tests
        run: pnpm test

      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit

      - name: Production build
        run: pnpm run build

  retention-test:
    name: GHCR retention mocked tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run mocked retention tests
        run: bash .github/scripts/test-ghcr-retention.sh

  docker:
    name: Compose validation, image build, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build backend and frontend images
        run: docker compose build

      - name: Backend image hygiene check
        run: |
          docker run --rm --entrypoint sh bhoomitrace-backend:local -c '
            set -e
            test "$(id -u)" = "1000"
            for p in typescript vitest tsx drizzle-kit; do test ! -e "/app/node_modules/$p"; done
            test -d /app/drizzle
            test -d /data/uploads
            if grep -rIl "bhoomitrace:bhoomitrace" /app 2>/dev/null; then
              echo "credential literal found in image" >&2
              exit 1
            fi
            echo "backend image hygiene ok"
          '

      - name: Frontend image hygiene check
        run: |
          docker run --rm --entrypoint sh bhoomitrace-frontend:local -c '
            set -e
            test "$(id -u)" != "0"
            test -f /usr/share/nginx/html/index.html
            test -d /usr/share/nginx/html/assets
            test ! -e /usr/share/nginx/html/node_modules
            test ! -e /usr/share/nginx/html/src
            test ! -e /usr/share/nginx/html/package.json
            if command -v node >/dev/null 2>&1; then echo "node present in runtime image" >&2; exit 1; fi
            if command -v pnpm >/dev/null 2>&1; then echo "pnpm present in runtime image" >&2; exit 1; fi
            echo "frontend image hygiene ok"
          '

      - name: Smoke test Compose stack
        run: |
          set -e
          docker compose up -d

          echo "::group::Backend readiness and liveness"
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/health
          curl -sf http://127.0.0.1:3000/health/live
          echo "::endgroup::"

          echo "::group::Frontend serving and SPA fallback"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5173/ >/dev/null 2>&1; then break; fi
            sleep 2
          done
          root_code=$(curl -s -o /tmp/index.html -w '%{http_code}' http://127.0.0.1:5173/)
          test "$root_code" = "200"
          grep -qi '<div id="root"' /tmp/index.html
          spa_code=$(curl -s -o /tmp/spa.html -w '%{http_code}' http://127.0.0.1:5173/reviewer/cases/123)
          test "$spa_code" = "200"
          grep -qi '<div id="root"' /tmp/spa.html
          echo "::endgroup::"

          echo "::group::Frontend /api/ proxy reaches backend"
          # Unauthenticated request through the proxy must reach the backend and
          # return 401 (a broken proxy would return 404 or 502 instead).
          for i in $(seq 1 30); do
            proxy_code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5173/api/v1/auth/me)
            if [ "$proxy_code" = "401" ]; then break; fi
            sleep 2
          done
          echo "GET /api/v1/auth/me via frontend proxy -> $proxy_code"
          test "$proxy_code" = "401"
          echo "::endgroup::"

          docker compose ps

      - name: Tear down Compose stack
        if: always()
        run: docker compose down
