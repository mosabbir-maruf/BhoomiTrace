# BhoomiTrace local development services (database, migrations, API, worker, frontend)
# Configuration defaults are safe for local development without a root .env file

name: bhoomitrace

# Shared backend environment configuration (uses Compose DNS 'postgres' for database)
x-backend-environment: &backend-environment
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:-bhoomitrace}:${POSTGRES_PASSWORD:-bhoomitrace}@postgres:5432/${POSTGRES_DB:-bhoomitrace}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  # Allowed origins for API requests; defaults to local frontend dev server
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  # Evidence storage directory mounted on shared backend-uploads volume
  UPLOAD_DIR: /data/uploads
  # Extraction provider; mock reader is offline, deterministic, and credential-free
  EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-mock}

x-backend-service: &backend-service
  image: bhoomitrace-backend:local
  build:
    context: ./backend
    dockerfile: Dockerfile
  environment: *backend-environment
  # Run init process as PID 1 for signal forwarding and graceful shutdown
  init: true

services:
  postgres:
    image: postgres:17-alpine
    container_name: bhoomitrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhoomitrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhoomitrace}
      POSTGRES_DB: ${POSTGRES_DB:-bhoomitrace}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-bhoomitrace_test}
    ports:
      # Bind to loopback only to prevent external network exposure
      - target: 5432
        published: "${POSTGRES_HOST_PORT:-5433}"
        host_ip: 127.0.0.1
        protocol: tcp
        mode: ingress
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Initialization script creates integration-test database on first startup
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot migration job; completes before API and worker start
  migrate:
    <<: *backend-service
    command: ["node", "dist/db/migrate-cli.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # HTTP API server
  api:
    <<: *backend-service
    command: ["node", "dist/server.js"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # Bind to loopback only to prevent external network exposure
      - target: 3000
        published: "${API_HOST_PORT:-3000}"
        host_ip: 127.0.0.1
        protocol: tcp
        mode: ingress
    volumes:
      - backend-uploads:/data/uploads
    healthcheck:
      # Readiness probe checks API status and PostgreSQL connectivity
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  # Background extraction worker running as an isolated process
  worker:
    <<: *backend-service
    command: ["node", "dist/worker/main.js"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *backend-environment
      # Smaller connection pool reserves database connections for API handlers
      DATABASE_POOL_MAX: ${WORKER_DATABASE_POOL_MAX:-5}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-60}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      WORKER_RETRY_BACKOFF_SECONDS: ${WORKER_RETRY_BACKOFF_SECONDS:-5}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
    volumes:
      # Shared upload volume enables worker to access files uploaded via API
      - backend-uploads:/data/uploads
    stop_grace_period: 30s

  # Production-style frontend: Vite build served by unprivileged nginx, which
  # reverse-proxies /api/ to the api service on the same origin
  frontend:
    image: bhoomitrace-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Bind to loopback only to prevent external network exposure
      - target: 8080
        published: "${FRONTEND_HOST_PORT:-5173}"
        host_ip: 127.0.0.1
        protocol: tcp
        mode: ingress
    healthcheck:
      # Unprivileged nginx serves the SPA root; a 200 confirms the server is up
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 10s

volumes:
  # Persistent database storage surviving container recreation
  postgres-data:
    name: bhoomitrace-postgres-data
  # Named volume for uploaded evidence preserving unprivileged node ownership
  backend-uploads:
    name: bhoomitrace-backend-uploads
