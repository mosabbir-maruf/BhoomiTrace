# BhoomiTrace edge server blocks: TLS termination, HTTP redirect, ACME webroot,
# and same-origin routing for the SPA and the API.
#
# Trusted proxy behaviour
# -----------------------
# The API runs with TRUST_PROXY=true, so it believes X-Forwarded-For. That is
# only safe if a client cannot choose that value. This proxy therefore OVERWRITES
# both X-Forwarded-For and X-Forwarded-Proto rather than appending to them:
#
#   * X-Forwarded-For   $remote_addr  — the real peer, never a client-supplied
#                                        header. Rate limiting keys on this.
#   * X-Forwarded-Proto https        — fixed, because TLS is always terminated
#                                        here and the inner hop is plain HTTP.
#
# The API has no published port, so this proxy is the only path to it.

# ---------------------------------------------------------------------------
# HTTP: ACME challenge and health stay here; everything else redirects to HTTPS
# ---------------------------------------------------------------------------
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # Certbot HTTP-01 challenge files are written into the EBS-backed webroot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        access_log off;
    }

    # Unauthenticated liveness for the host-level checks and load balancers
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS: the real service
# ---------------------------------------------------------------------------
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # HSTS is only sent once TLS is actually valid. Confirm the certificate is
    # in place before browsing, or the browser will cache the directive for a
    # site that cannot serve HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Must be >= the API's UPLOAD_MAX_BYTES (default 5 MiB) with headroom for
    # multipart framing. A smaller value rejects valid uploads before the API
    # ever sees them.
    client_max_body_size 6m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API: routed straight to the backend, bypassing the frontend container, so
    # exactly one hop ever sets the forwarded headers.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Stream uploads to the API instead of buffering them to disk
        proxy_request_buffering off;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # Everything else is the single-page application
    location / {
        proxy_pass http://frontend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
