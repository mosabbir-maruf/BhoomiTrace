# BhoomiTrace edge reverse proxy — main nginx configuration.
#
# This is the only container in the production stack with published ports. It
# terminates TLS and is the single entry point for both the SPA and the API.
# Server blocks live in conf.d/bhoomitrace.conf.
#
# Static configuration on purpose: no envsubst templating, so an environment
# variable can never silently rewrite nginx's own `$host`/`$uri` variables, and
# what is reviewed is exactly what runs. The deployment serves one hostname, so
# `server_name _;` with default_server is both sufficient and unambiguous.

user  nginx;
worker_processes  auto;

# Container-native logging: the Docker json-file driver (bounded to 10m x 5 in
# docker-compose.prod.yml) is what CloudWatch log shipping reads.
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $http_x_forwarded_for is always overwritten to the true peer address by the
    # proxy_set_header rules in conf.d, so the value logged here cannot be spoofed.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /dev/stdout  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Do not advertise the nginx version in responses or error pages
    server_tokens   off;

    # Buffers for TLS-terminated request bodies; uploads are streamed to the API
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    gzip  on;
    gzip_min_length 1024;
    gzip_types  text/plain text/css application/json application/javascript
                text/xml application/xml image/svg+xml application/wasm;

    include /etc/nginx/conf.d/*.conf;
}
