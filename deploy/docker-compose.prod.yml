# BhoomiTrace — single-host production stack (EC2 + Docker Compose).
#
# This file is deliberately separate from the repository-root docker-compose.yml.
# The local development stack keeps its own volumes, published ports, and
# development credentials, and is not modified by anything here.
#
# Always invoke it through deploy/scripts/compose.sh, which supplies both
# environment files. An equivalent manual invocation is:
#
#   docker compose -f deploy/docker-compose.prod.yml \
#     --env-file deploy/env/stack.env \
#     --env-file deploy/env/secrets.env config
#
# Network exposure
# ---------------
# Only `edge` publishes ports (80 and 443). PostgreSQL, the API, and the worker
# publish nothing at all, so they are unreachable from the public internet even
# if an EC2 security group is later misconfigured. The frontend publishes
# nothing either; it is reachable only through the edge.
#
# Secrets
# -------
# No credential is written in this file. POSTGRES_PASSWORD lives only in
# deploy/env/secrets.env (mode 0600, never committed), and DATABASE_URL is
# composed from it at container start.

name: bhoomitrace-prod

x-logging: &logging
  driver: json-file
  options:
    # Bound container log growth so a chatty process cannot fill the EBS volume.
    # CloudWatch log shipping reads the same json-file stream.
    max-size: "10m"
    max-file: "5"

# Non-negotiable production settings. An environment file may also define these
# names, but the values below win, so a mistaken env file cannot start a
# development-mode or insecure-cookie stack in production.
x-production-env: &production-env
  NODE_ENV: production
  COOKIE_SECURE: "true"
  TRUST_PROXY: "true"
  UPLOAD_DIR: /data/uploads

x-backend-service: &backend-service
  image: "${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable ghcr.io reference (sha-<40> or @sha256:<digest>)}"
  env_file:
    # Indirection so a harness (and only a harness) can point the stack at a
    # throwaway configuration. scripts/compose.sh exports both variables; a
    # manual invocation falls back to the real files.
    - "${BHOOMITRACE_STACK_ENV:-./env/stack.env}"
    - "${BHOOMITRACE_SECRETS_ENV:-./env/secrets.env}"
  environment:
    <<: *production-env
    # Composed here so the password exists only in secrets.env
    DATABASE_URL: "postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}"
  init: true
  logging: *logging
  restart: unless-stopped
  networks: [private]

services:
  postgres:
    image: "${POSTGRES_IMAGE:-postgres:17-alpine}"
    restart: unless-stopped
    logging: *logging
    networks: [private]
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      POSTGRES_DB: "${POSTGRES_DB:?}"
      # Keep PostgreSQL's own timezone-independent defaults explicit
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Bind mount, not a named volume: the directory is a dedicated EBS mount on
      # the host. prepare-host.sh creates it with postgres uid/gid ownership.
      - "${BHOOMITRACE_DATA_DIR:?BHOOMITRACE_DATA_DIR must point at the EBS mount}/postgres:/var/lib/postgresql/data"
    # No `ports:` key. PostgreSQL is never published to the host or the internet;
    # administrative access goes through `docker compose exec postgres psql`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 60s

  # One-shot migration job. Runs to completion before the API and worker start,
  # and is re-run by deploy.sh before the new image is released.
  #
  # It must wait for PostgreSQL to accept queries: on a cold start the database
  # is still initialising while the container is up, and a migration that races
  # it fails and aborts the whole deployment.
  migrate:
    <<: *backend-service
    command: ["node", "dist/db/migrate-cli.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # Synthetic demo data loader. Disabled by default and enabled only with
  # `--profile demo`, because the seed refuses to run against a production
  # database unless NODE_ENV says otherwise. The override below is the entire
  # reason this service exists: it makes the refusal explicit and auditable at
  # the point of use instead of weakening the guard in the application.
  #
  # NEVER enable this against real records. It inserts synthetic parcels only.
  seed:
    <<: *backend-service
    profiles: ["demo"]
    command: ["node", "dist/db/seed-cli.js"]
    environment:
      <<: *production-env
      NODE_ENV: development
      DATABASE_URL: "postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend-service
    command: ["node", "dist/server.js"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Same host directory as the worker, mounted at the same container path
      - "${BHOOMITRACE_DATA_DIR:?}/uploads:/data/uploads"
    healthcheck:
      # Readiness: API status plus PostgreSQL connectivity
      test:
        - CMD
        - node
        - -e
        - |
          fetch('http://127.0.0.1:3000/health')
            .then((r) => process.exit(r.status === 200 ? 0 : 1))
            .catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s

  worker:
    <<: *backend-service
    command: ["node", "dist/worker/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *production-env
      DATABASE_URL: "postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}"
      # Smaller pool keeps database connections available to API handlers
      DATABASE_POOL_MAX: "${WORKER_DATABASE_POOL_MAX:-5}"
    volumes:
      # Identical host directory and container path as the API. Evidence written
      # by the API is therefore readable by the worker with no copy step.
      - "${BHOOMITRACE_DATA_DIR:?}/uploads:/data/uploads"
    healthcheck:
      # The worker has no HTTP surface, so liveness is "a worker process exists".
      # `process.getBuiltinModule` avoids depending on the container's module type.
      # The path is built with concatenation rather than a template literal so
      # that no `${...}` sequence is left for Compose to interpolate away.
      test:
        - CMD
        - node
        - -e
        - |
          const fs = process.getBuiltinModule('node:fs')
          const alive = fs
            .readdirSync('/proc')
            .filter((entry) => /^[0-9]+$/.test(entry))
            .some((pid) => {
              try {
                return fs
                  .readFileSync('/proc/' + pid + '/cmdline', 'utf8')
                  .includes('worker/main.js')
              } catch {
                return false
              }
            })
          process.exit(alive ? 0 : 1)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  # Static SPA. It still declares an /api upstream, so it must share a network
  # with the API or nginx would fail to resolve that upstream at startup.
  frontend:
    image: "${FRONTEND_IMAGE:?FRONTEND_IMAGE must be an immutable ghcr.io reference (sha-<40> or @sha256:<digest>)}"
    restart: unless-stopped
    logging: *logging
    networks: [private]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 10s

  # TLS-terminating reverse proxy. The only service with published ports.
  edge:
    image: "${EDGE_IMAGE:-nginx:1.30.6-alpine}"
    restart: unless-stopped
    logging: *logging
    networks: [private]
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    environment:
      # Rendered into the access log so a request can be traced to a hostname
      DOMAIN: "${DOMAIN:?}"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./edge/conf.d:/etc/nginx/conf.d:ro
      # Certificate is a flat pair produced by issue-certificate.sh / its deploy hook
      - "${BHOOMITRACE_TLS_DIR:?}/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro"
      - "${BHOOMITRACE_TLS_DIR:?}/privkey.pem:/etc/nginx/tls/privkey.pem:ro"
      # ACME HTTP-01 webroot; writable so certbot can place challenge files
      - "${BHOOMITRACE_DATA_DIR:?}/acme:/var/www/acme"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 15s

networks:
  # One user-defined network. Isolation comes from publishing no ports for
  # postgres/api/worker/frontend, so nothing but the edge is reachable from the
  # host or the internet. See deploy/README.md for the optional hardening step
  # that splits this into an internal database network.
  private:
    name: bhoomitrace-prod-private
