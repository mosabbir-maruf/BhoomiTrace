# BhoomiTrace frontend — unprivileged nginx server.
#
# Serves the compiled Vite single-page app and reverse-proxies the API on the
# same origin so the frontend's relative /api/v1 requests reach the backend.
# Runs as the unprivileged nginx user (uid 101) on port 8080.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Must be >= the backend upload limit (UPLOAD_MAX_BYTES, default 5 MiB) with
    # headroom for multipart framing; a smaller value would reject valid uploads.
    client_max_body_size 6m;

    # Proxy API calls to the Compose backend, preserving the complete URI
    # (/api/v1/... is forwarded unchanged). Cookies (bt_session), the CSRF
    # header (x-csrf-token), uploads, and streamed downloads pass through as-is.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream request bodies (document uploads) instead of buffering them to disk
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed build assets are immutable; cache them aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: serve files when present, otherwise fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
